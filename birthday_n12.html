<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N12 - פרויקט יום הולדת</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap');

/* ========== RESET & BASE ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
  font-family: 'Yonit';
  src: local('Yonit'), local('Yonit-Regular');
  font-weight: 400;
  font-style: normal;
}

:root {
  --font-he: 'Yonit', 'Segoe UI', 'Arial', sans-serif;
  --font-en: 'Open Sans', sans-serif;
  --n12-red: #DB0000;
  --n12-dark-red: #AE0000;
  --dark-gray: #333538;
}

body {
  font-family: var(--font-he);
  direction: rtl;
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100vh;
}

/* ========== N12 IFRAME BACKGROUND ========== */
#n12-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
  z-index: 0;
}

/* ========== MODAL OVERLAY ========== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity 0.3s ease;
}
.modal-overlay.hidden { opacity: 0; pointer-events: none; }

.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 40px 32px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: modalIn 0.4s ease;
}
@keyframes modalIn {
  from { transform: scale(0.9) translateY(20px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.modal-logo {
  width: 100px;
  margin-bottom: 16px;
}

.modal-box h2 {
  font-size: 26px;
  color: var(--dark-gray);
  margin-bottom: 8px;
}
.modal-box p {
  font-size: 15px;
  color: #666;
  margin-bottom: 24px;
}

.form-group {
  margin-bottom: 16px;
  text-align: right;
}
.form-group label {
  display: block;
  font-size: 14px;
  color: var(--dark-gray);
  margin-bottom: 6px;
  font-weight: 600;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  font-family: var(--font-he);
  direction: rtl;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--n12-red);
}
.form-group .gender-row {
  display: flex;
  gap: 12px;
}
.form-group .gender-row label {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 400;
  transition: all 0.2s;
}
.form-group .gender-row input[type="radio"] { width: auto; }
.form-group .gender-row label:has(input:checked) {
  border-color: var(--n12-red);
  background: #fff0f0;
}

.btn-start {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--n12-red), var(--n12-dark-red));
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-family: var(--font-he);
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-start:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(219,0,0,0.3);
}

.error-msg {
  color: var(--n12-red);
  font-size: 13px;
  margin-top: 4px;
  display: none;
}

/* ========== LOADING SCREEN ========== */
#loading-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  z-index: 2000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
}
#loading-screen.active { display: flex; }

.loading-hourglass {
  font-size: 64px;
  animation: spin 1.2s linear infinite;
  margin-bottom: 30px;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}

.loading-year {
  font-size: 72px;
  font-weight: 700;
  font-family: var(--font-en);
  margin-bottom: 20px;
  color: #fff;
  text-shadow: 0 0 30px rgba(255,255,255,0.3);
}

.loading-text {
  font-size: 22px;
  min-height: 30px;
  color: rgba(255,255,255,0.8);
}

/* ========== DASHBOARD (all themes) ========== */
#dashboard {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 3000;
  display: none;
  overflow-y: auto;
  overflow-x: hidden;
}
#dashboard.active { display: block; }

/* ========== NEWSPAPER THEME (<=1984) ========== */
.theme-newspaper {
  background-color: #f4edd4;
  position: relative;
}
.theme-newspaper::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9999;
  background:
    /* vignette - dark edges like old paper */
    radial-gradient(ellipse at center, transparent 50%, rgba(120,100,60,0.25) 100%),
    /* coffee stain top-right */
    radial-gradient(circle at 85% 12%, rgba(160,120,60,0.12) 0%, transparent 8%),
    /* coffee stain bottom-left */
    radial-gradient(circle at 15% 85%, rgba(140,110,50,0.1) 0%, transparent 10%),
    /* subtle aged spots */
    radial-gradient(circle at 30% 40%, rgba(130,100,50,0.06) 0%, transparent 5%),
    radial-gradient(circle at 70% 60%, rgba(130,100,50,0.06) 0%, transparent 4%),
    radial-gradient(circle at 50% 20%, rgba(130,100,50,0.05) 0%, transparent 6%);
}
.theme-newspaper::after {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9998;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="300" height="300" filter="url(%23paper)" opacity="0.12"/></svg>');
  mix-blend-mode: multiply;
}
.theme-newspaper .content-area,
.theme-newspaper .header-bar,
.theme-newspaper .nav-bar,
.theme-newspaper .info-bar {
  position: relative;
  z-index: 1;
}

.theme-newspaper .header-bar {
  background: #434343;
  color: #fff;
  padding: 12px 20px;
  font-size: 16px;
  display: flex;
  justify-content: center;
  gap: 40px;
}

.theme-newspaper .nav-bar {
  background: #f6f3e9;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-bottom: 1px solid #434343;
}

.theme-newspaper .nav-bar .logo-img {
  height: 25px;
}

.theme-newspaper .nav-bar .btn-back {
  position: absolute;
  left: 20px;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: #434343;
}

.theme-newspaper .nav-bar .btn-share {
  position: absolute;
  right: 20px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #434343;
}

.theme-newspaper .info-bar {
  background: #f6f3e9;
  border-bottom: 1px solid #434343;
  padding: 10px 20px;
  display: flex;
  justify-content: center;
  gap: 40px;
  font-size: 16px;
  color: #323232;
}
.theme-newspaper .info-bar .date { font-weight: 700; }

.theme-newspaper .content-area {
  max-width: 960px;
  margin: 20px auto;
  padding: 0 20px;
}

/* Newspaper card */
.np-card {
  background: #f6f3e9;
  border: 1px solid #434343;
  overflow: hidden;
}
.np-card-header {
  padding: 8px 12px;
  border-bottom: 1px solid #434343;
  font-size: 14px;
  font-weight: 700;
  color: #434343;
  text-align: right;
}
.np-card-body {
  padding: 12px;
}
.np-card-body img {
  width: 100%;
  aspect-ratio: 142/138;
  object-fit: cover;
  display: block;
  margin-bottom: 10px;
  filter: sepia(0.3);
}
.np-card-body .card-title {
  font-size: 18px;
  line-height: 1.3;
  color: #434343;
  margin-bottom: 4px;
}
.np-card-body .card-sub {
  font-size: 14px;
  color: rgba(0,0,0,0.4);
}
.np-card-body .card-link {
  font-size: 14px;
  color: rgba(0,0,0,0.4);
  margin-top: 6px;
  cursor: pointer;
}

/* Newspaper avatar row */
.np-avatar-row {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}
.np-avatar-img-wrap {
  flex: 1;
}
.np-avatar-img-wrap img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  filter: sepia(0.2);
}
.np-avatar-bubble-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.np-avatar-bubble {
  position: relative;
}
.np-avatar-bubble img {
  max-height: 180px;
}

/* Newspaper grid */
.np-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 20px;
}

/* Newspaper bottom section */
.np-bottom-section {
  display: flex;
  gap: 20px;
  margin-bottom: 40px;
}
.np-bottom-left {
  flex: 0 0 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.np-bottom-left .radio-img {
  width: 200px;
  filter: sepia(0.2);
}
.np-bottom-right {
  flex: 1;
}

/* Number card newspaper */
.np-number-card {
  background: #f6f3e9;
  border: 1px solid #434343;
  text-align: center;
  padding: 20px;
}
.np-number-card .num {
  font-size: 54px;
  font-weight: 400;
  color: #434343;
  line-height: 1.1;
}
.np-number-card .num-sub {
  font-size: 14px;
  color: rgba(0,0,0,0.4);
}

/* ========== WINDOWS 95 THEME (1985-2005) ========== */
.theme-win95 {
  background: #008080;
}

.theme-win95 .header-bar {
  background: #323232;
  color: #fff;
  padding: 12px 20px;
  font-size: 16px;
  display: flex;
  justify-content: center;
  gap: 40px;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #737373;
}

.theme-win95 .nav-bar {
  background: #e7e7e7;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #737373;
}
.theme-win95 .nav-bar .logo-img { height: 25px; }
.theme-win95 .nav-bar .btn-back {
  position: absolute;
  left: 20px;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: #323232;
}
.theme-win95 .nav-bar .btn-share {
  position: absolute;
  right: 20px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #323232;
}

.theme-win95 .info-bar {
  background: #e7e7e7;
  padding: 10px 20px;
  display: flex;
  justify-content: center;
  gap: 40px;
  font-size: 16px;
  color: #323232;
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #737373;
}
.theme-win95 .info-bar .date { font-weight: 700; }

.theme-win95 .content-area {
  max-width: 960px;
  margin: 20px auto;
  padding: 0 20px;
}

/* Win95 card */
.win-card {
  background: #fff;
  border: 5px solid #d9d9d9;
  box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #737373, 0 4px 4px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
}
.win-card-titlebar {
  background: linear-gradient(90deg, #010986, #1080D0);
  padding: 4px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  direction: rtl;
}
.win-card-titlebar .title-text {
  color: #fff;
  font-size: 14px;
  flex: 1;
  text-align: right;
  padding-right: 6px;
}
.win-card-titlebar .title-btns {
  display: flex;
  gap: 2px;
}
.win-card-titlebar .title-btn {
  width: 20px; height: 20px;
  background: #d9d9d9;
  border: none;
  box-shadow: inset 0.8px 0.8px 0 #fff, inset -0.8px -0.8px 0 #737373;
  cursor: pointer;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.win-card-divider {
  height: 3px;
  background: #d9d9d9;
}
.win-card-body {
  background: #fff;
  padding: 10px;
  flex: 1;
}
.win-card-body img {
  width: 100%;
  aspect-ratio: 142/138;
  object-fit: cover;
  display: block;
  margin-bottom: 10px;
}
.win-card-body .card-title {
  font-size: 18px;
  line-height: 1.3;
  color: #000;
  margin-bottom: 4px;
}
.win-card-body .card-sub {
  font-size: 14px;
  color: rgba(0,0,0,0.4);
}
.win-card-body .card-link {
  font-size: 14px;
  color: rgba(0,0,0,0.4);
  margin-top: 6px;
  cursor: pointer;
}

/* Win95 avatar */
.win-avatar-row {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}
.win-avatar-card { flex: 1; }
.win-avatar-clippy {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.win-avatar-clippy .clippy-img {
  width: 113px;
  height: 180px;
  object-fit: contain;
}
.win-speech-bubble {
  background: #fcf6c8;
  border: 2px solid #272727;
  border-radius: 4px;
  box-shadow: 0 4px 4px rgba(0,0,0,0.25);
  padding: 20px;
  position: relative;
  font-size: 18px;
  line-height: 1.4;
  color: #000;
}
.win-speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -16px;
  right: 30px;
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 16px solid #fcf6c8;
}

.win-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 20px;
}

/* Win95 bottom */
.win-bottom-section {
  display: flex;
  gap: 20px;
  margin-bottom: 40px;
}
.win-bottom-left {
  flex: 0 0 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.win-bottom-left .cds-img {
  width: 200px;
  image-rendering: pixelated;
}
.win-bottom-right { flex: 1; }

.win-number-card {
  background: #fff;
  border: 5px solid #d9d9d9;
  box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #737373, 0 4px 4px rgba(0,0,0,0.25);
  text-align: center;
  padding: 20px;
}
.win-number-card .win-card-titlebar { margin: -20px -20px 15px -20px; }
.win-number-card .num {
  font-size: 54px;
  color: #000;
  line-height: 1.1;
}
.win-number-card .num-sub {
  font-size: 14px;
  color: rgba(0,0,0,0.4);
}

/* ========== MODERN N12 THEME (2006-2026) ========== */
.theme-modern {
  background: #f2f2f2;
}

.theme-modern .global-nav {
  background: #fff;
  padding: 6px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.theme-modern .global-nav-inner {
  max-width: 1200px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.theme-modern .global-nav .nav-logos {
  display: flex;
  align-items: center;
  gap: 8px;
}
.theme-modern .global-nav .nav-date {
  font-size: 14px;
  color: var(--dark-gray);
  display: flex;
  align-items: center;
  gap: 10px;
}

.theme-modern .header-red {
  background: linear-gradient(188deg, var(--n12-red), var(--n12-dark-red));
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 56px;
}
.theme-modern .header-red-inner {
  max-width: 1200px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.theme-modern .header-red .logo-img {
  height: 28px;
}
.theme-modern .header-red .nav-links {
  display: flex;
  gap: 6px;
  align-items: center;
}
.theme-modern .header-red .nav-link {
  color: #fff;
  font-size: 15px;
  padding: 8px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.theme-modern .header-red .btn-back {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 8px;
}
.theme-modern .header-red .btn-share {
  background: none;
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  padding: 8px;
}

.theme-modern .content-area {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 20px;
}

/* Modern cards */
.mod-card {
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.mod-card-label {
  background: var(--n12-red);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 4px 12px;
  display: inline-block;
  border-radius: 0 0 0 6px;
  float: left;
}
.mod-card-body {
  padding: 14px;
}
.mod-card-body img {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 10px;
}
.mod-card-body .card-title {
  font-size: 18px;
  line-height: 1.4;
  color: var(--dark-gray);
  font-weight: 700;
  margin-bottom: 4px;
}
.mod-card-body .card-sub {
  font-size: 13px;
  color: #888;
}

/* Modern hero */
.mod-hero {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  margin-bottom: 20px;
  position: relative;
}
.mod-hero img {
  width: 100%;
  height: 400px;
  object-fit: cover;
}
.mod-hero-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  padding: 30px 24px 20px;
  color: #fff;
}
.mod-hero-overlay .label {
  background: var(--n12-red);
  font-size: 13px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 10px;
}
.mod-hero-overlay h2 {
  font-size: 28px;
  line-height: 1.3;
  margin-bottom: 8px;
}
.mod-hero-overlay .sub {
  font-size: 14px;
  opacity: 0.8;
}

/* Modern chat box */
.mod-chat {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.mod-chat-header {
  background: var(--n12-red);
  color: #fff;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mod-chat-msg {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  align-items: flex-start;
}
.mod-chat-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #eee;
  flex-shrink: 0;
  overflow: hidden;
}
.mod-chat-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.mod-chat-bubble {
  background: #f5f5f5;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  color: var(--dark-gray);
  max-width: 80%;
}
.mod-chat-time {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

.mod-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.mod-layout-row {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}
.mod-sidebar { flex: 0 0 380px; }
.mod-main { flex: 1; }

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {

// Fill gaps: for any year not defined, find nearest
function getDataForYear(year) {
  if (DATA[year]) return DATA[year];
  let closest = null, minDiff = Infinity;
  for (const y of Object.keys(DATA)) {
    const diff = Math.abs(parseInt(y) - year);
    if (diff < minDiff) { minDiff = diff; closest = y; }
  }
  return DATA[closest];
}

function getTheme(year) {
  if (year <= 1984) return 'newspaper';
  if (year <= 2005) return 'win95';
  return 'modern';
}

function getDayName(dateStr) {
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const d = new Date(dateStr);
  return 'יום ' + days[d.getDay()];
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.getDate().toString().padStart(2,'0') + '.' + (d.getMonth()+1).toString().padStart(2,'0') + '.' + d.getFullYear();
}

// ========== FORM SUBMIT ==========
function handleSubmit() {
  const birthdate = document.getElementById('birthdate').value;
  const fullname = document.getElementById('fullname').value.trim();
  const gender = document.querySelector('input[name="gender"]:checked');

  if (!birthdate || !fullname || !gender) {
    document.getElementById('error-msg').style.display = 'block';
    return;
  }
  document.getElementById('error-msg').style.display = 'none';

  const year = new Date(birthdate).getFullYear();
  startLoading(year, fullname, gender.value, birthdate);
}

// ========== LOADING ==========
function startLoading(year, name, gender, birthdate) {
  document.getElementById('modal-overlay').classList.add('hidden');
  const screen = document.getElementById('loading-screen');
  screen.classList.add('active');

  const yearEl = document.getElementById('loading-year');
  const textEl = document.getElementById('loading-text');
  const texts = ['נוסעים אחורה...', 'מחפשים...', 'טוענים...'];
  let currentYear = 2026;
  let textIdx = 0;

  const textInterval = setInterval(() => {
    textIdx = (textIdx + 1) % texts.length;
    textEl.textContent = texts[textIdx];
  }, 800);

  const yearInterval = setInterval(() => {
    if (currentYear <= year) {
      clearInterval(yearInterval);
      clearInterval(textInterval);
      setTimeout(() => {
        screen.classList.remove('active');
        showDashboard(year, name, gender, birthdate);
      }, 500);
      return;
    }
    currentYear -= Math.max(1, Math.floor((currentYear - year) / 15));
    if (currentYear < year) currentYear = year;
    yearEl.textContent = currentYear;
  }, 80);
}

// ========== DASHBOARD ==========
function showDashboard(year, name, gender, birthdate) {
  const data = getDataForYear(year);
  const theme = getTheme(year);
  const dashboard = document.getElementById('dashboard');
  const greeting = gender === 'female' ? `שלום ${name}! חזרנו לתאריך בו נולדת` : `שלום ${name}! חזרנו לתאריך בו נולדת`;
  const dayName = getDayName(birthdate);
  const formattedDate = formatDate(birthdate);

  let html = '';

  if (theme === 'newspaper') {
    html = buildNewspaperTheme(data, name, gender, year, dayName, formattedDate, greeting);
  } else if (theme === 'win95') {
    html = buildWin95Theme(data, name, gender, year, dayName, formattedDate, greeting);
  } else {
    html = buildModernTheme(data, name, gender, year, dayName, formattedDate, greeting);
  }

  dashboard.innerHTML = html;
  dashboard.classList.add('active');
  document.body.style.overflow = 'auto';
}

      alert('הקישור הועתק!');
    }).catch(() => {
